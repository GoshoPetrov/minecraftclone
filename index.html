<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voxel Sandbox</title>
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas"></canvas>
      <div id="crosshair" aria-hidden="true"></div>
      <div id="play-overlay" class="overlay">
        <div class="overlay__panel">
          <h1 class="overlay__title">Voxel Sandbox</h1>
          <p class="overlay__prompt">Click to play</p>
          <p class="overlay__controls">WASD move &middot; Space jump &middot; Mouse look &middot; Esc release cursor</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
